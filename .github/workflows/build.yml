name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  packages: write
  # GITHUB_TOKEN needs this for the update-pins job to open its pull request
  # with peter-evans/create-pull-request.
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opencode-typescript

jobs:
  build:
    runs-on: ubuntu-latest
    # The status job reports what was built, so the resolved versions are
    # exposed at job level.
    outputs:
      opencode: ${{ steps.versions.outputs.opencode }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check documentation examples
        run: bash scripts/check-docs.sh

      - name: Resolve current versions
        id: versions
        run: |
          bash scripts/resolve-versions.sh >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # The arm64 half of the build (and its smoke test) runs emulated on
        # the amd64 runner.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # A single multi-arch image: the engine picks the variant, so an
          # Apple Silicon Mac pulls linux/arm64 and runs it natively.
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENCODE_VERSION=${{ steps.versions.outputs.opencode }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:oc-${{ steps.versions.outputs.opencode }}-node${{ steps.versions.outputs.node }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.date }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-buildcache:build
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-buildcache:build,mode=max

      - name: Smoke test (linux/amd64 and linux/arm64)
        env:
          SMOKE_PASSWORD: smoke-test-password
          OPENCODE_VERSION: ${{ steps.versions.outputs.opencode }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:oc-${{ steps.versions.outputs.opencode }}-node${{ steps.versions.outputs.node }}"
          bash scripts/smoke-test.sh amd64 "$IMAGE"
          bash scripts/smoke-test.sh arm64 "$IMAGE"

  update-pins:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve current versions
        id: versions
        run: bash scripts/resolve-versions.sh >> "$GITHUB_OUTPUT"

      - name: Compare with versions.json
        id: diff
        run: |
          set -euo pipefail
          CURRENT="$(jq -cS . versions.json)"
          NEW="$(jq -cnS --arg oc "${{ steps.versions.outputs.opencode }}" \
            --arg node "${{ steps.versions.outputs.node }}" \
            '{opencode: $oc, node: $node}')"
          if [[ "$CURRENT" == "$NEW" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write updated versions.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          jq -cnS --arg oc "${{ steps.versions.outputs.opencode }}" \
            --arg node "${{ steps.versions.outputs.node }}" \
            '{opencode: $oc, node: $node}' > versions.json

      - name: Create pull request with updated pins
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-pinned-versions
          base: main
          title: "chore: update pinned toolchain versions to OpenCode ${{ steps.versions.outputs.opencode }} and Node ${{ steps.versions.outputs.node }}"
          commit-message: "chore: update pinned toolchain versions"
          body: |
            The build workflow resolved newer upstream versions than the pins
            recorded in `versions.json`. Merging this pull request rebuilds and
            republishes the image with the new versions.

  status:
    # Publishes the last-build badge JSON. It runs even when the build fails,
    # so the badge turns red instead of showing a stale green.
    needs: [build, update-pins]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose the status badge
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          UPDATE_PINS_RESULT: ${{ needs.update-pins.result }}
          OPENCODE: ${{ needs.build.outputs.opencode }}
          NODE: ${{ needs.build.outputs.node }}
        run: |
          set -euo pipefail
          now="$(date -u '+%Y-%m-%d %H:%M') UTC"
          if [[ "$BUILD_RESULT" == "success" && "$UPDATE_PINS_RESULT" == "success" ]]; then
            color=green
            message="${now} · oc ${OPENCODE:-?} / node ${NODE:-?}"
          else
            color=red
            message="${now} · failed"
          fi
          jq -n \
            --arg message "$message" \
            --arg color "$color" \
            '{schemaVersion: 1, label: "build", message: $message, color: $color, cacheSeconds: 300}' \
            > status.json
          cat status.json

      - name: Publish the status branch
        # The branch holds a single commit with status.json; the checkout
        # credentials cover the push, so no token is written into the URL.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan status
          git read-tree --empty
          git add status.json
          git commit --allow-empty -q -m "chore: update the build status badge"
          git push --force origin status
