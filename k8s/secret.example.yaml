# Template for the runtime Secret consumed by the deployment (envFrom).
# Replace the placeholders, save as secret.yaml in the namespace, and apply
# it. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: opencode
type: Opaque
stringData:
  # Required for the default model.
  OPENROUTER_API_KEY: "sk-or-replace-me"
  # Password for the OpenCode server (HTTP API, Basic auth with the username
  # "opencode"). When left empty, the server generates a random one and
  # prints it to the pod log on start.
  OPENCODE_PASSWORD: "change-me"
  # Optional: GitHub token for git over HTTPS and the gh CLI.
  GH_TOKEN: ""
  # Optional: git identity for commits.
  GIT_AUTHOR_NAME: "opencode-agent"
  GIT_AUTHOR_EMAIL: "agent@localhost"
  GIT_COMMITTER_NAME: "opencode-agent"
  GIT_COMMITTER_EMAIL: "agent@localhost"
